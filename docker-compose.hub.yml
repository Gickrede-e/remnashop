x-app-image: &app-image ${APP_IMAGE:-gickrede/remnashop:local}

x-build-args: &build-args
  NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
  NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME}
  NEXT_PUBLIC_TELEGRAM_BOT_USERNAME: ${NEXT_PUBLIC_TELEGRAM_BOT_USERNAME}

x-app-build: &app-build
  context: .
  target: runner
  args: *build-args
  secrets:
    - build_env

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "100m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
        reservations:
          memory: 512M
          cpus: "0.5"

  migrate:
    image: *app-image
    build:
      <<: *app-build
    command: ["sh", "scripts/migrate-and-seed.sh"]
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    logging: *default-logging

  app:
    image: *app-image
    build:
      <<: *app-build
    env_file:
      - .env
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      smtp:
        condition: service_started
    networks:
      - default
      - mail_internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    logging: *default-logging

  smtp:
    image: foxcpp/maddy:0.8.1
    restart: unless-stopped
    env_file:
      - .env
    entrypoint:
      - /bin/sh
      - -ec
      - |
        : "$${MAIL_DOMAIN:?MAIL_DOMAIN is required}"
        : "$${MAIL_HOSTNAME:?MAIL_HOSTNAME is required}"

        MAIL_DKIM_SELECTOR="$${MAIL_DKIM_SELECTOR:-mail}"

        mkdir -p /data/run

        cat > /data/maddy.conf <<EOF
        state_dir /data
        runtime_dir /data/run
        hostname $${MAIL_HOSTNAME}

        target.remote outbound_delivery {
            hostname $${MAIL_HOSTNAME}
            mx_auth {
                dane
                mtasts {
                    cache fs
                }
            }
        }

        target.queue outbound_queue {
            target &outbound_delivery
            max_tries 10
            autogenerated_msg_domain $${MAIL_DOMAIN}
        }

        smtp tcp://0.0.0.0:2525 {
            hostname $${MAIL_HOSTNAME}
            tls off
            debug no

            source $${MAIL_DOMAIN} {
                modify {
                    dkim {
                        domains $${MAIL_DOMAIN}
                        selector $${MAIL_DKIM_SELECTOR}
                    }
                }

                default_destination {
                    deliver_to &outbound_queue
                }
            }

            default_source {
                reject 550 5.7.1 "Sender domain is not allowed"
            }
        }
        EOF

        exec /bin/maddy run
    volumes:
      - smtp_data:/data
    networks:
      - mail_internal
    logging: *default-logging

  worker:
    image: *app-image
    build:
      <<: *app-build
    command: ["node", "scripts/worker.mjs"]
    env_file:
      - .env
    environment:
      APP_INTERNAL_URL: http://app:3000
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      app:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    deploy:
      mode: replicated
      replicas: 1

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - ./backups/postgres:/backups
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - |
        : "$${BACKUP_GPG_PASSPHRASE:?BACKUP_GPG_PASSPHRASE is required}"
        apk add --no-cache gnupg >/dev/null
        mkdir -p /backups
        while true; do
          ts=$$(date +%Y%m%d-%H%M%S)
          out="/backups/postgres-$${ts}.sql.gpg"
          PGPASSWORD="$${POSTGRES_PASSWORD}" pg_dump -h postgres -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" \
            | gpg --symmetric --cipher-algo AES256 --batch --yes \
                  --passphrase "$${BACKUP_GPG_PASSPHRASE}" --output "$${out}"
          find /backups -type f -name 'postgres-*.sql.gpg' -mtime +$${BACKUP_RETENTION_DAYS} -delete
          echo "[backup] $${out}"
          sleep "$${BACKUP_INTERVAL_SECONDS}"
        done
    logging: *default-logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
    logging: *default-logging

volumes:
  postgres_data:
  smtp_data:
  caddy_data:
  caddy_config:

networks:
  mail_internal:

secrets:
  build_env:
    file: .env
